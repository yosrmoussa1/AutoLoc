spring.application.name=autoloc-api
# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3307/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
server.port=8081
server.servlet.context-path=/Autoloc
springdoc.api-docs.path=/v3/api-docs
# Replier les méthodes au démarrage de Swagger
springdoc.swagger-ui.doc-expansion=none

# Trier les classes par ordre alphabétique
springdoc.swagger-ui.tagsSorter=alpha

# Trier les méthodes par ordre alphabétique
springdoc.swagger-ui.operationsSorter=alpha